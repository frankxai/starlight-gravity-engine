name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (dev tooling only — the engine has zero runtime deps)
        run: pnpm install --frozen-lockfile

      # The full gate: schema validation, tests, typecheck, lint, build.
      - name: Verify
        run: pnpm run verify

      # Prove the engine runs with no build step and no runtime dependencies.
      - name: Smoke test the CLI from a clean directory
        run: |
          set -e
          WORK="$(mktemp -d)"
          cd "$WORK"
          node "$GITHUB_WORKSPACE/packages/cli/src/bin.ts" init
          node "$GITHUB_WORKSPACE/packages/cli/src/bin.ts" capture \
            --note "Met Ada at the dinner. Insight: sovereignty is the moat. I'll send the essay Friday." --save --json
          node "$GITHUB_WORKSPACE/packages/cli/src/bin.ts" doctor
